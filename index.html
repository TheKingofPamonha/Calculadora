<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/reset.css">
    <link rel="stylesheet" href="style/style.css">
    <title>Calculadora - Davi Luis</title>
</head>
<body>
    <main>
        <h1>Calculadora | <strong>Davi Luis</strong></h1>
        <section class="calculadora">
            <div class="container">
                <div class="header-visor">
                    <input type="text" readonly class="visor" id="visor">
                </div>
                <div class="main-btn">
                    <button class="calcu-btn acao">CE</button>
                    <button class="calcu-btn acao">C</button>
                    <button class="calcu-btn acao">&#9003;</button>
                    <button class="calcu-btn btn-operador">&percnt;</button>
                    <button class="calcu-btn numero">7</button>
                    <button class="calcu-btn numero">8</button>
                    <button class="calcu-btn numero">9</button>
                    <button class="calcu-btn btn-operador">&divide;</button>
                    <button class="calcu-btn numero">4</button>
                    <button class="calcu-btn numero">5</button>
                    <button class="calcu-btn numero">6</button>
                    <button class="calcu-btn btn-operador">&times;</button>
                    <button class="calcu-btn numero">1</button>
                    <button class="calcu-btn numero">2</button>
                    <button class="calcu-btn numero">3</button>
                    <button class="calcu-btn btn-operador">&minus;</button>
                    <button class="calcu-btn numero">0</button>
                    <button class="calcu-btn numero">&comma;</button>
                    <button class="calcu-btn btn-operador">&plus;</button>
                    <button id="btn-igual" class="calcu-btn btn-operador">&equals;</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="rotape-container">
            <p class="rotape-texto">© 2026 Davi. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
